<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gallery | EverAfter</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header"></div>
    <main>
      <section
        class="page-hero short"
        style="
          background-image: url('img/img3.jpg');
          height: 500px;
        "
      >
        <div>
          <span class="eyebrow light">A FEW FAVOURITE MOMENTS</span>
          <h1>Love, <em>in frames.</em></h1>
        </div>
      </section>
      <section class="section-pad container">
        <div class="text-center mb-5">
          <span class="eyebrow">THE GALLERY</span>
          <h2>Little moments. <em>Big feelings.</em></h2>
          <p class="narrow">
            A glimpse into celebrations filled with joy, beauty and all the
            in-between magic.
          </p>
        </div>
        <div class="gallery-grid">
          <img
            src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=900&q=80"
          /><img
            src="img/img4.jpg"
          /><img
            src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=900&q=80"
          /><img
            src="img/img2.jpg"
          /><img
            src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e?auto=format&fit=crop&w=900&q=80"
          /><img
            src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=900&q=80"
          /><img
            src="https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&fit=crop&w=900&q=80"
          /><img
            src="https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=900&q=80"
          />
        </div>
      </section>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
